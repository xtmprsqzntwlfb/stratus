[tox]
envlist = py3,lint
skipsdist = false

[testenv]
usedevelop = true
extras = test
commands = pytest {posargs}

[testenv:lint]
# Nothing that rewrites code, only something that reads it: the project
# has no formatter and the diffs are easier to follow without one.
deps = pyflakes
commands = pyflakes stratus tests

[pytest]
testpaths = tests
