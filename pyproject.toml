[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "stratus"
version = "0.1.0"
description = "A lightweight web interface for OpenStack"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tatiana Ovchinnikova", email = "t.v.ovtchinnikova@gmail.com" }]
keywords = ["openstack", "dashboard", "web"]
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Flask",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "Flask",
    "openstacksdk",
    "keystoneauth1",
]

[project.optional-dependencies]
test = ["pytest", "pyflakes"]

[project.urls]
Source = "https://github.com/xtmprsqzntwlfb/stratus"

[tool.setuptools]
# Templates and the stylesheet are the interface, not extras.
include-package-data = true

[tool.setuptools.packages.find]
include = ["stratus*"]

[tool.setuptools.package-data]
stratus = ["templates/*.html", "static/*.css", "local_settings.py.example"]
