{% extends "base.html" %}
{% block title %}{{ project.name }} &mdash; Stratus{% endblock %}

{% block content %}
<p class="crumbs"><a href="{{ url_for('ui.projects') }}">Projects</a></p>

<h1>{{ project.name }}</h1>

<ul class="resources">
  <li><a href="{{ url_for('ui.servers', project_id=project.id) }}">Servers</a></li>
</ul>

<dl>
  {% for label, value in fields %}
  <dt>{{ label }}</dt><dd>{{ value }}</dd>
  {% endfor %}
</dl>
{% endblock %}
